# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Refresh do estoque de cartas contempladas (LD Cred) — 2× por hora
  schedule:
    - cron: "*/30 * * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Atualizar estoque de cartas contempladas (LD Cred)
        env:
          ESTOQUE_URL: ${{ secrets.LDCRED_ESTOQUE_URL }}
        run: |
          if [ -z "$ESTOQUE_URL" ]; then
            echo "::warning::Secret LDCRED_ESTOQUE_URL não configurado — publicando com o data/cartas.json do repositório."
            exit 0
          fi
          mkdir -p data
          if curl -fsS --max-time 30 "$ESTOQUE_URL" -o data/cartas.json.tmp; then
            mv data/cartas.json.tmp data/cartas.json
            echo "Estoque atualizado ($(wc -c < data/cartas.json) bytes)."
          else
            rm -f data/cartas.json.tmp
            echo "::warning::Falha ao buscar o estoque — mantendo a última versão publicada."
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
